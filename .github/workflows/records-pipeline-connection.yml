name: WP2 prepared controller connection
on:
  pull_request:
  push:
    branches: [main, 'codex/records-*']
permissions:
  contents: read
jobs:
  prepared-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout actual WP2 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pragma: allowlist secret - public action commit
        with:
          path: engine
          persist-credentials: false
      - name: Pinned WP1 ledger
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pragma: allowlist secret - public action commit
        with:
          repository: Grahammmm/DeFlock-Campaign-Tool
          ref: 4a356f8dd7e4a2ea64fa271ab07e1e48cce6ebe3 # pragma: allowlist secret - public commit
          path: dependencies/wp1
          persist-credentials: false
      - name: Pinned WP4 extraction
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pragma: allowlist secret - public action commit
        with:
          repository: Grahammmm/DeFlock-Campaign-Tool
          ref: 853ba723af29492b2c836e2f9c8f86f53577eb7a # pragma: allowlist secret - public commit
          path: dependencies/wp4
          persist-credentials: false
      - name: Pinned WP5 catalog and trusted CI helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pragma: allowlist secret - public action commit
        with:
          repository: Grahammmm/DeFlock-Campaign-Tool
          ref: b12129ac016f0129f092e80befc209e94f7f7f09 # pragma: allowlist secret - public commit
          path: dependencies/wp5
          persist-credentials: false
      - name: Pinned PR19 catalog links
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pragma: allowlist secret - public action commit
        with:
          repository: Grahammmm/DeFlock-Campaign-Tool
          ref: 543c5eaee5022409e66df7a9f7c81fd9d9bfbf57 # pragma: allowlist secret - public commit
          path: dependencies/pr19
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pragma: allowlist secret - public action commit
        with:
          python-version: '${{ matrix.python }}'
      - name: Install existing test dependencies on disposable CI only
        working-directory: engine
        run: python -m pip install -r requirements-records-test.txt
      - name: Select in-tree or pinned dependency roots
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          # Explicit file-based detection: a dependency present in the candidate
          # checkout is taken from it; otherwise its pinned checkout is used.
          select_root() {
            if [[ -f "$2" ]]; then
              printf '%s in tree (%s); using the candidate checkout\n' "$1" "$2"
              printf '%s_ROOT=%s\n' "${1^^}" "$GITHUB_WORKSPACE/engine" >> "$GITHUB_ENV"
            else
              printf '%s_ROOT=%s\n' "${1^^}" "$GITHUB_WORKSPACE/dependencies/$1" >> "$GITHUB_ENV"
            fi
          }
          select_root wp1 campaign_tool/records/ledger/store.py
          select_root wp4 campaign_tool/records/extraction_ledger.py
          select_root wp5 campaign_tool/records/ledger_catalog.py
          select_root pr19 campaign_tool/records/catalog_links.py
      - name: Require exactly one prepared-admission test with zero skips
        working-directory: engine
        run: |
          python -B tools/run_wp2_pipeline_ci.py \
            --candidate-root "$GITHUB_WORKSPACE/engine" \
            --wp1 "$WP1_ROOT" \
            --wp4 "$WP4_ROOT" \
            --wp5 "$WP5_ROOT" \
            --pr19 "$PR19_ROOT" \
            --output-parent "$RUNNER_TEMP"
