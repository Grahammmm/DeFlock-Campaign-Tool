name: Offline engine checks
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    # The full synthetic suite measured 620-1063 s on successful hosted runs
    # (2026-10-25) and was killed at the former 18-minute step cap on main and
    # PRs alike; keep the cap well above the measured maximum.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # PRs: one interpreter (the merge clock). Main push: full matrix.
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.11","3.12","3.13"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Optional intake test dependencies (CI runner only)
        run: |
          if [ -f requirements-records-test.txt ]; then
            python -m pip install -r requirements-records-test.txt
          fi
      - name: S3a adoption and reconciliation acceptance (SD-12 CI ownership)
        run: python -B -W error::ResourceWarning -m unittest tests.records.test_mail_resolution_census tests.records.test_mail_adoption tests.records.test_original_reconciliation
      - name: Synthetic offline tests
        timeout-minutes: 30
        run: python -B -W error::ResourceWarning -m unittest discover -v
      - name: Public-tree credential and private-path scan
        run: python -B tools/check_public_tree.py
