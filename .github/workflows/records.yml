name: Offline engine checks
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ (vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.CI_RUNNER || 'ubuntu-24.04' }}
    # The full synthetic suite measured 620-1063 s on successful hosted runs
    # (2026-10-25) and was killed at the former 18-minute step cap on main and
    # PRs alike; keep the cap well above the measured maximum.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # PRs: one interpreter (the merge clock). Main push: full matrix.
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.11","3.12","3.13"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Optional intake test dependencies (CI runner only)
        run: |
          if [ -f requirements-records-test.txt ]; then
            python -m pip install -r requirements-records-test.txt
          fi
      - name: S3a adoption and reconciliation acceptance (SD-12 CI ownership)
        run: python -B -W error::ResourceWarning -m unittest tests.records.test_mail_resolution_census tests.records.test_mail_adoption tests.records.test_original_reconciliation
      - name: Synthetic offline tests
        timeout-minutes: 30
        run: python -B -W error::ResourceWarning -m unittest discover -v
      - name: Public-tree credential and private-path scan
        run: python -B tools/check_public_tree.py
  pin-guard:
    # A PR that changes a hash-pinned file must re-pin it in the same PR.
    # Own check name on purpose: inside "offline" a pin break is masked
    # whenever main is already red there (DeFlock #342, 2026-10-28).
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ${{ (vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          # CI merge commit + its first parent (the base) = exactly this PR's diff.
          fetch-depth: 2
      - name: Pinned files change only together with their pins
        run: python3 -B tools/check_pin_guard.py --base HEAD^1
