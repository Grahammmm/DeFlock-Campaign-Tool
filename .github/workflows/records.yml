name: Offline engine checks
on:
  pull_request:
    paths:
      - '.github/workflows/records.yml'
      - '**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'conftest.py'
      - '**/conftest.py'
      - 'campaign_tool/__init__.py'
      - 'tests/__init__.py'
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["3.11", "3.12", "3.13"]' || '["3.11", "3.12"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Optional intake test dependencies (CI runner only)
        run: |
          if [ -f requirements-records-test.txt ]; then
            python -m pip install -r requirements-records-test.txt
          fi
      - name: Synthetic offline tests
        timeout-minutes: 15
        run: python -B -m unittest discover -v
      - name: Public-tree credential and private-path scan
        run: python -B tools/check_public_tree.py
