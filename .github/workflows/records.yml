name: Offline engine checks
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  affected:
    # Only the merge clock; full-tier source tests run below on 3.11–3.13.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    # Shards 2/3 run up to ~10 min; 20 leaves headroom (AUD-DF3, 2026-10-31).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-records-test.txt -r requirements-runner.txt
      - name: Changed-area source tests (disjoint shards)
        env:
          TMPDIR: /var/tmp
        run: python -B -W error::ResourceWarning tools/ci_affected.py --tier pr --shard ${{ matrix.shard }} --shards 5 --jobs 0
  offline:
    # Preserve the required check name, and fail closed on any failed shard.
    needs: affected
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && fromJSON('["3.12"]') || fromJSON('["3.11","3.12","3.13"]') }}
    steps:
      - name: Require every fast-tier shard
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          SHARDS: ${{ needs.affected.result }}
        run: test "$SHARDS" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Full-tier dependencies
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: python -m pip install -r requirements-records-test.txt -r requirements-runner.txt
      - name: Full source coverage minus explicitly owned integration suites
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        env:
          TMPDIR: /var/tmp
        run: python -B -W error::ResourceWarning tools/ci_affected.py --tier full --jobs 0
      - name: Public-tree credential and private-path scan
        run: python -B tools/check_public_tree.py
      - name: Every pin matches (main, nightly, dispatch)
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && matrix.python == '3.12'
        run: python3 -B tools/check_pin_guard.py --all
      - name: Affected-selector unit checks (synthetic graph only)
        run: python -B tools/ci_affected.py --self-test
  pin-guard:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Public strict patterns (all PR and merge-group changes)
        run: python -B -m campaign_tool.records scan-public --patterns-only
      - name: Pinned files change only together with their pins
        run: python3 -B tools/check_pin_guard.py --base HEAD^1
