name: Offline engine checks
on:
  pull_request:
  push:
    branches: [main, 'codex/records-*']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Synthetic offline tests
        run: python -B -m unittest discover -v
      - name: Public-tree credential and private-path scan
        run: python -B tools/check_public_tree.py
