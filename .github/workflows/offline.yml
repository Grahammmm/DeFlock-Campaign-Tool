name: Offline shell checks
on:
  workflow_call:
# records.yml owns cancellation and the shared full discovery gate.
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ github.event_name == 'pull_request' && '3.13' || '3.12' }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
            setup.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Optional records test dependencies (CI runner only)
        run: |
          if [ -f requirements-records-test.txt ]; then
            python3 -m pip install -r requirements-records-test.txt
          fi
      # Full Python discovery is a mandatory dependency of records.yml's shell
      # aggregate; do not repeat it in this reusable non-Python-checks job.
      - run: node --test tests/*.test.mjs
      - run: python3 -m campaign_tool build --directory examples/fictional-campaign --check
      - run: node scripts/scan-secrets.mjs
      - run: python3 -B tools/check_public_tree.py
