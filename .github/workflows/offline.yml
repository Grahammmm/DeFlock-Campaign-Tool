name: Offline shell checks
on:
  schedule:
    - cron: '17 7 * * *'
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Optional records test dependencies (CI runner only)
        run: |
          if [ -f requirements-records-test.txt ]; then
            python3 -m pip install -r requirements-records-test.txt
          fi
      # All Python modules have a single source-test owner in ci_affected.py.
      - run: node --test tests/*.test.mjs
      # Example reproducibility belongs to campaign-install.yml.
      - run: node scripts/scan-secrets.mjs
