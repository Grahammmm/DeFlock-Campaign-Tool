name: Offline shell checks
on:
  schedule:
    - cron: '17 7 * * *'
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Optional records test dependencies (CI runner only)
        run: |
          if [ -f requirements-records-test.txt ]; then
            python3 -m pip install -r requirements-records-test.txt
          fi
      # All Python modules have a single source-test owner in ci_affected.py.
      - run: node --test tests/*.test.mjs
      # Example reproducibility belongs to campaign-install.yml.
      - run: node scripts/scan-secrets.mjs
