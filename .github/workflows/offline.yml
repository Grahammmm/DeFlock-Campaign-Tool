name: Offline shell checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Optional records test dependencies (CI runner only)
        run: |
          if [ -f requirements-records-test.txt ]; then
            python3 -m pip install -r requirements-records-test.txt
          fi
      - run: python3 -m unittest discover -s tests -t . -v
      - run: node --test tests/*.test.mjs
      - run: python3 -m campaign_tool build --directory examples/fictional-campaign --check
      - run: node scripts/scan-secrets.mjs
