name: Records controller kernel faults
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  kernel-faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pragma: allowlist secret - public action commit
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pragma: allowlist secret - public action commit
        with:
          python-version: ${{ matrix.python }}
      - name: Actual subprocess and flock fault acceptance, zero skips
        run: |
          mkdir -m 700 "$RUNNER_TEMP/controller-private"
          env -i HOME="$HOME" PATH="$PATH" TMPDIR="$RUNNER_TEMP/controller-private" PYTHONPATH="$PWD" PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName('tests.records.test_controller_kernel_faults')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PY
      - name: Public tree and credential checks
        run: |
          python -B tools/check_public_tree.py
          node scripts/scan-secrets.mjs
