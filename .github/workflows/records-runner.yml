name: Records runner integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pinned public ledger candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Grahammmm/DeFlock-Campaign-Tool
          ref: 4a356f8dd7e4a2ea64fa271ab07e1e48cce6ebe3 # pragma: allowlist secret - verified public ledger commit
          path: .wp1-dependency
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-records-test.txt
      - name: Select in-tree or pinned WP1 ledger
        shell: bash
        run: |
          # Explicit file-based detection: an in-tree ledger is used from this checkout.
          if [[ -f campaign_tool/records/ledger/store.py ]]; then
            printf '%s\n' 'WP1 in tree; WP1_OVERLAY left unset.'
          else
            printf 'WP1_OVERLAY=%s\n' "$GITHUB_WORKSPACE/.wp1-dependency" >> "$GITHUB_ENV"
          fi
      - name: Required synthetic integration against in-tree or pinned ledger
        run: |
          python -B tests/records/run_runner_composition.py
