name: Records native mail completion
on:
  schedule:
    - cron: '17 7 * * *'
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    env:
      REQUIRE_NATIVE_MSG: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-records-test.txt
      - run: python -B -m unittest -v tests.records.test_mail_wire_intake tests.records.test_native_completion tests.records.test_rfc822_consumer
      - run: python -B tools/check_public_tree.py
