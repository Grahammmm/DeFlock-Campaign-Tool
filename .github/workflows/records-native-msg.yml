name: Records native mail completion
on:
  schedule:
    - cron: '17 7 * * *'
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    env:
      REQUIRE_NATIVE_MSG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-records-test.txt
      - run: python -B -m unittest -v tests.records.test_mail_wire_intake tests.records.test_native_completion tests.records.test_rfc822_consumer
      - run: python -B tools/check_public_tree.py
