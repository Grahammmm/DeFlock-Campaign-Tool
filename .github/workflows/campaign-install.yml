name: Installed campaign CLI
on:
  schedule:
    - cron: '17 7 * * *'
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Public resource parity
        run: python3 -B tools/sync_campaign_resources.py
      - name: Resource and CLI regressions
        run: python3 -B -m unittest tests.test_campaign_install_resources tests.test_campaign_wheel_harness tests.test_cli tests.test_discovery tests.test_kit tests.test_law -v
      - name: Build clean-source candidate wheel
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: python3 -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/campaign-wheels"
      - name: Install in a separate environment
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: |
          python3 -m venv "$RUNNER_TEMP/campaign-venv"
          "$RUNNER_TEMP/campaign-venv/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/campaign-wheels/*.whl
      - name: Exercise installed commands away from checkout
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: python3 -B tools/test_campaign_wheel.py --python "$RUNNER_TEMP/campaign-venv/bin/python" --expected-commit "$(git rev-parse HEAD)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Example campaign builds reproducibly (moved from Offline shell checks for PRs)
        run: python3 -B -m campaign_tool build --directory examples/fictional-campaign --check
      - run: node scripts/scan-secrets.mjs
