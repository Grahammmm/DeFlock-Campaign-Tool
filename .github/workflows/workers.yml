name: Workers checks
on:
  pull_request:
  push:
    branches: [main, 'codex/workers-*']
permissions:
  contents: read
jobs:
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: workers
      - run: npm run check
        working-directory: workers
      - run: python3 -B -m unittest tests.test_review_fixture -v
      - run: node scripts/scan-secrets.mjs
      - run: python3 -B tools/check_public_tree.py
