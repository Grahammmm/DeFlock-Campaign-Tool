name: Workers checks
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # PR path scope (git glob pathspecs). "workers" is listed in
  # .github/required-checks.json, so it always starts and reports; on a PR that
  # touches none of these paths its check steps are skipped (job succeeds).
  PR_SCOPE: |
    workers/**
    runner/__init__.py
    runner/outbox_gateway.py
    campaign_tool/__init__.py
    campaign_tool/outbox.py
    campaign_tool/review.py
    tests/__init__.py
    tests/test_review_fixture.py
    tests/fixtures/review-cases.json
    tools/test_hosted_outbox_bridge.py
    tools/check_public_tree.py
    scripts/scan-secrets.mjs
    package*.json
    pyproject.toml
    setup.py
    requirements*.txt
    constraints*.txt
    *.lock
    .github/workflows/workers.yml
jobs:
  workers:
    runs-on: ${{ (vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - name: PR path scope (other events always run every step)
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          specs=(); while IFS= read -r p; do [[ -n "$p" ]] && specs+=(":(glob)$p"); done <<< "$PR_SCOPE"
          if ! changed="$(git diff --name-only HEAD^1 HEAD -- "${specs[@]}")"; then
            echo "::warning::PR diff unavailable; running every step"; echo run=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf 'In-scope changes:\n%s\n' "${changed:-none, so the check steps are skipped}"
          if [[ -n "$changed" ]]; then echo run=true; else echo run=false; fi >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.12'
      - run: npm ci
        if: steps.scope.outputs.run == 'true'
        working-directory: workers
      - run: npm run check
        if: steps.scope.outputs.run == 'true'
        working-directory: workers
      - name: Signed Worker-to-outbox interoperability (synthetic loopback only)
        if: steps.scope.outputs.run == 'true'
        run: python3 -B tools/test_hosted_outbox_bridge.py
      - run: python3 -B -m unittest tests.test_review_fixture -v
        if: steps.scope.outputs.run == 'true'
      - run: node scripts/scan-secrets.mjs
        if: steps.scope.outputs.run == 'true'
      - run: python3 -B tools/check_public_tree.py
        if: steps.scope.outputs.run == 'true'
