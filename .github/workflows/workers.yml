name: Workers checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: workers
      - run: npm run check
        working-directory: workers
      - name: Signed Worker-to-outbox interoperability (synthetic loopback only)
        run: python3 -B tools/test_hosted_outbox_bridge.py
      - run: python3 -B -m unittest tests.test_review_fixture -v
      - run: node scripts/scan-secrets.mjs
      - run: python3 -B tools/check_public_tree.py
