name: Records run slice
on:
  schedule:
    - cron: '17 7 * * *'
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PRs: one interpreter (the merge clock). Main push: full matrix.
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.11","3.12","3.13"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pragma: allowlist secret - public action commit
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # pragma: allowlist secret - public action commit
        with:
          python-version: ${{ matrix.python }}
      - name: Local OCR tools (disposable CI runner only)
        run: |
          # The runner image's default mirror (azure.archive.ubuntu.com) can fail DNS for
          # minutes at a time. Use the canonical archive host, keep each attempt short and
          # retry a bounded number of times, then fail loudly (no skip, no soft pass).
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt
          fi
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          ok=0
          for attempt in 1 2 3; do
            if sudo apt-get $APT_OPTS update -qq && sudo apt-get $APT_OPTS install -y -qq tesseract-ocr poppler-utils >/dev/null; then
              ok=1
              break
            fi
            echo "apt attempt $attempt failed" >&2
            sleep $((attempt * 10))
          done
          [ "$ok" = 1 ]
          tesseract --version | head -1
          pdftoppm -v 2>&1 | head -1
      - run: python -m pip install -r requirements-records-parsers.txt
      - name: Single-command slice, publish and PDF/OCR tests with zero skips
        env:
          TMPDIR: /var/tmp
        run: |
          python -B - <<'PY'
          import unittest
          names = ['tests.records.test_runtime', 'tests.records.test_run_slice', 'tests.records.test_publish', 'tests.records.test_run_pdf_ocr', 'tests.records.test_review_retirement', 'tests.records.test_publish_authority', 'tests.records.test_proposal_provenance', 'tests.records.test_context_revision', 'tests.records.test_context_runtime', 'tests.records.test_unattended_context', 'tests.records.test_unattended_resume', 'tests.records.test_run_safety', 'tests.records.test_native_extract', 'tests.records.test_t12_harness_strictness', 'tests.records.test_t13_receipt_tooling', 'tests.records.test_runtime_disk_preflight']
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PY
  retirement-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pragma: allowlist secret - public action commit
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # pragma: allowlist secret - public action commit
        with:
          python-version: '3.11'
      - name: Actual SQLite 10000/10001 retirement and bounded replay (synthetic only)
        env:
          # Synthetic SQLite fixture only; retain real rows, commits and all guards.
          # Avoid host-disk fsync latency while building 10001 test-only receipts.
          TMPDIR: /dev/shm
        run: python -B -m tests.records.retirement_boundary
