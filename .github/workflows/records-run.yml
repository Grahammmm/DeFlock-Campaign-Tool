name: Records run slice
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  slice:
    runs-on: ${{ (vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PRs: one interpreter (the merge clock). Main push: full matrix.
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.11","3.12","3.13"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pragma: allowlist secret - public action commit
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pragma: allowlist secret - public action commit
        with:
          python-version: ${{ matrix.python }}
      - name: Local OCR tools (disposable CI runner only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils >/dev/null
          tesseract --version | head -1
          pdftoppm -v 2>&1 | head -1
      - run: python -m pip install -r requirements-records-parsers.txt
      - name: Single-command slice, publish and PDF/OCR tests with zero skips
        env:
          TMPDIR: /var/tmp
        run: |
          python -B - <<'PY'
          import unittest
          names = ['tests.records.test_runtime', 'tests.records.test_run_slice', 'tests.records.test_publish', 'tests.records.test_run_pdf_ocr', 'tests.records.test_review_retirement', 'tests.records.test_publish_authority', 'tests.records.test_proposal_provenance', 'tests.records.test_context_revision', 'tests.records.test_context_runtime', 'tests.records.test_unattended_context', 'tests.records.test_unattended_resume', 'tests.records.test_run_safety', 'tests.records.test_native_extract', 'tests.records.test_t12_harness_strictness', 'tests.records.test_t13_receipt_tooling', 'tests.records.test_runtime_disk_preflight']
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PY
  retirement-boundary:
    runs-on: ${{ (vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pragma: allowlist secret - public action commit
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pragma: allowlist secret - public action commit
        with:
          python-version: '3.11'
      - name: Actual SQLite 10000/10001 retirement and bounded replay (synthetic only)
        env:
          # Synthetic SQLite fixture only; retain real rows, commits and all guards.
          # Avoid host-disk fsync latency while building 10001 test-only receipts.
          TMPDIR: /dev/shm
        run: python -B -m tests.records.retirement_boundary
