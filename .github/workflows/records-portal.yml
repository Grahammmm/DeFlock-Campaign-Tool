name: Records portal integration
on:
  pull_request:
  push:
    branches: ['codex/records-wp3-portal']
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact public ledger candidate for integration only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Grahammmm/DeFlock-Campaign-Tool
          ref: 4a356f8dd7e4a2ea64fa271ab07e1e48cce6ebe3 # pragma: allowlist secret - verified public WP1 commit
          path: .wp1-dependency
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-records-test.txt
      - name: Synthetic portal and actual ledger contract
        run: |
          python -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PY
        env:
          TMPDIR: /var/tmp
          RECORDS_WP1_SOURCE_ROOT: ${{ github.workspace }}/.wp1-dependency
