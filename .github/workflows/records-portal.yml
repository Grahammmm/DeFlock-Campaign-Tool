name: Records portal integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact public ledger candidate for integration only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Grahammmm/DeFlock-Campaign-Tool
          ref: 4a356f8dd7e4a2ea64fa271ab07e1e48cce6ebe3 # pragma: allowlist secret - verified public WP1 commit
          path: .wp1-dependency
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-records-test.txt
      - name: Select in-tree or pinned WP1 ledger
        shell: bash
        run: |
          # Explicit file-based detection: an in-tree ledger is used from this checkout.
          if [[ -f campaign_tool/records/ledger/store.py ]]; then
            printf '%s\n' 'WP1 in tree; RECORDS_WP1_SOURCE_ROOT left unset.'
          else
            printf 'RECORDS_WP1_SOURCE_ROOT=%s\n' "$GITHUB_WORKSPACE/.wp1-dependency" >> "$GITHUB_ENV"
          fi
      - name: Synthetic portal and actual ledger contract
        run: |
          python -B - <<'PY'
          import unittest
          # Explicit portal scope, like the WP6/WP7/WP9 integration workflows:
          # whole-tree discovery would include opt-in composition suites that
          # skip by design and spawn-based runner tests that cannot run from stdin.
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'tests.test_records_portal', 'tests.test_records_portal_https',
              'tests.test_records_portal_repairs', 'tests.test_records_portal_runner_contract',
              'tests.test_records_portal_wp1'])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PY
        env:
          TMPDIR: /var/tmp
