name: Records queue integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pinned public ledger candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Grahammmm/DeFlock-Campaign-Tool
          ref: 4a356f8dd7e4a2ea64fa271ab07e1e48cce6ebe3 # pragma: allowlist secret - verified public ledger commit
          path: .wp1-dependency
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-records-test.txt
      - name: Select in-tree or pinned WP1 ledger
        shell: bash
        run: |
          # Explicit file-based detection: an in-tree ledger is used from this checkout.
          if [[ -f campaign_tool/records/ledger/store.py ]]; then
            printf '%s\n' 'WP1 in tree; using this checkout.'
            printf 'RECORDS_WP1_SOURCE_ROOT=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            printf 'RECORDS_WP1_SOURCE_ROOT=%s\n' "$GITHUB_WORKSPACE/.wp1-dependency" >> "$GITHUB_ENV"
          fi
      - name: Required synthetic integration against in-tree or pinned ledger
        env:
          TMPDIR: /var/tmp
        run: |
          python -B - <<'PY'
          import os, pathlib, unittest
          import campaign_tool.records, tests.records
          engine = pathlib.Path.cwd().resolve()
          root = pathlib.Path(os.environ['RECORDS_WP1_SOURCE_ROOT']).resolve(strict=True)
          in_tree = (engine/'campaign_tool/records/ledger/store.py').is_file()
          if in_tree != (root == engine):
              raise SystemExit('WP1 source mismatch: in-tree ledger requires the engine root')
          if not in_tree:
              campaign_tool.records.__path__.append(str(root/'campaign_tool'/'records'))
              tests.records.__path__.append(str(root/'tests'/'records'))
          from campaign_tool.records.ledger import stages
          if not pathlib.Path(stages.__file__).resolve().is_relative_to(root/'campaign_tool'/'records'/'ledger'):
              raise SystemExit('WP1 ledger loaded from an unexpected source')
          print('WP1 source:', 'in-tree' if in_tree else 'pinned overlay', root, flush=True)
          suite = unittest.defaultTestLoader.loadTestsFromNames(['tests.records.test_queue_runtime', 'tests.records.test_queue', 'tests.records.test_queue_scope', 'tests.records.test_queue_integration'])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PY
