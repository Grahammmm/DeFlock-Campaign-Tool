name: Records release package
on:
  pull_request:
    paths:
      - '.github/workflows/records-release.yml'
      - '**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'conftest.py'
      - '**/conftest.py'
      - 'campaign_tool/__init__.py'
      - 'tests/__init__.py'
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    # Full synthetic suite plus dependency install and source-bound packaging.
    # The suite step measured 650-1013 s on successful hosted runs (2026-10-25)
    # and was killed at the former 18-minute step cap on main and PRs alike.
    timeout-minutes: 40
    strategy:
      # One interpreter's failure must not cancel and hide the other results.
      fail-fast: false
      matrix:
        python: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["3.11", "3.12", "3.13"]' || '["3.11", "3.12"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Install build and test dependencies in disposable CI
        run: python -m pip install -r requirements-build.txt -r requirements-records-test.txt -r requirements-records-parsers.txt
      - name: Synthetic tests and public patterns (not private export clearance)
        timeout-minutes: 30
        run: |
          python -B -m unittest discover -v
          python -B -m campaign_tool.records scan-public --patterns-only
      - name: Build immutable source-bound wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/records-wheels" .
      - name: Exercise installed package outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/records-runtime"
          "$RUNNER_TEMP/records-runtime/bin/python" -m pip install --no-deps --no-index "$RUNNER_TEMP"/records-wheels/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH= "$RUNNER_TEMP/records-runtime/bin/records" version --json > records-installed-version.json
          PYTHONPATH= "$RUNNER_TEMP/records-runtime/bin/records" validate-findings --help
          python -c 'import json,os; p=json.load(open("records-installed-version.json")); assert p["commit"]==os.environ["GITHUB_SHA"]; assert p["installation_kind"]=="installed_wheel"; assert p["source_dirty"] is False; assert p["ledger_schema_version"]==1'
      - name: Verify installed composition with synthetic fixtures outside checkout
        env:
          TMPDIR: /var/tmp
        run: |
          records_package_path="$("$RUNNER_TEMP/records-runtime/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$records_package_path:$GITHUB_WORKSPACE" python -B - <<'PY'
          import json, os, unittest
          from campaign_tool.records.release_manifest import version_report
          report = version_report()
          assert report['commit'] == os.environ['GITHUB_SHA']
          assert report['installation_kind'] == 'installed_wheel' and report['source_dirty'] is False
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'tests.records.test_original_reconciliation', 'tests.records.test_ledger',
              'tests.records.test_ledger_stages',
              'tests.records.test_ledger_occurrences', 'tests.records.test_ledger_occurrence_replay',
              'tests.records.test_queue', 'tests.records.test_extraction_validation',
              'tests.records.test_extraction_ledger', 'tests.records.test_image_artifact_binding',
              'tests.records.test_detectors', 'tests.records.test_detector_persistence',
              'tests.records.test_reconciliation_crash_composition',
              'tests.records.test_extraction_inherited_budget',
              'tests.records.test_ocr_closed_cas', 'tests.records.test_workbook_policy'])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PY
