name: Records extraction checks
on:
  pull_request:
  push:
    branches: ['codex/records-wp4-extraction']
permissions:
  contents: read
jobs:
  extraction:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-records-parsers.txt
      - run: python -B -m unittest tests.records.test_extraction_routes -v
        env:
          TMPDIR: /var/tmp
