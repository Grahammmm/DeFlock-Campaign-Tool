name: Records IMAP source and global budget
on:
  pull_request:
  push:
    branches: [main, 'codex/records-*']
permissions:
  contents: read
jobs:
  synthetic-imap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Synthetic IMAP tests with zero skips and no installs
        run: |
          python -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "tests.records.test_imap_intake",
              "tests.records.test_imap_config_sources",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PY
