name: Records no-install suites (IMAP, controller kernel faults)
on:
  schedule:
    - cron: '17 7 * * *'
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  synthetic-imap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # PRs: one interpreter (the merge clock). Main push: full matrix.
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.11","3.12","3.13"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '${{ matrix.python }}'
      - name: Synthetic IMAP tests with zero skips and no installs
        run: |
          python -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "tests.records.test_imap_intake",
              "tests.records.test_imap_config_sources",
              "tests.records.test_imap_failure_codes",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PY
      - name: Actual subprocess and flock fault acceptance, zero skips
        if: ${{ !cancelled() }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/controller-private"
          env -i HOME="$HOME" PATH="$PATH" TMPDIR="$RUNNER_TEMP/controller-private" PYTHONPATH="$PWD" PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName('tests.records.test_controller_kernel_faults')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PY
      - name: Public tree and credential checks
        if: ${{ !cancelled() }}
        run: |
          python -B tools/check_public_tree.py
          node scripts/scan-secrets.mjs
