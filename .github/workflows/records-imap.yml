name: Records IMAP source and global budget
on:
  pull_request:
  push:
    branches: [main, 'batch/**']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  synthetic-imap-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(github.event_name == 'pull_request' && github.head_ref != 'main' && !startsWith(github.head_ref, 'batch/') && '["3.13"]' || '["3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Synthetic IMAP tests with zero skips and no installs
        run: |
          python -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "tests.records.test_imap_intake",
              "tests.records.test_imap_config_sources",
              "tests.records.test_imap_failure_codes",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PY
  synthetic-imap:
    needs: synthetic-imap-tests
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - name: All selected interpreters must pass (PR compatibility alias)
        env:
          RESULT: ${{ needs.synthetic-imap-tests.result }}
        run: test "$RESULT" = success
