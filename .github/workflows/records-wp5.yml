name: WP5 pinned catalog composition
on:
  pull_request:
  push:
    branches: [main, 'codex/records-*']
permissions:
  contents: read
env:
  # Reviewed public source commit identities only, not credential exceptions.
  WP1_REVISION: '4a356f8dd7e4a2ea64fa271ab07e1e48cce6ebe3' # pragma: allowlist secret
  WP2_REVISION: '3d7ce8b9932061e25bf0099cbad99d6dc29269b9' # pragma: allowlist secret
  PR19_REVISION: '543c5eaee5022409e66df7a9f7c81fd9d9bfbf57' # pragma: allowlist secret
  # Reviewed WP4 public commit from PR21; no moving-reference fallback.
  WP4_REVISION: '853ba723af29492b2c836e2f9c8f86f53577eb7a' # pragma: allowlist secret
jobs:
  wp5:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout WP5 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pragma: allowlist secret
        with:
          path: engine
          persist-credentials: false
      - name: Require the reviewed WP4 public commit
        shell: bash
        run: |
          if [[ ! "$WP4_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'WP4_REVISION is pending. Parent must supply its exact public commit before this workflow can pass.' >&2
            exit 1
          fi
      - name: Checkout pinned WP1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pragma: allowlist secret
        with:
          repository: Grahammmm/DeFlock-Campaign-Tool
          ref: '${{ env.WP1_REVISION }}'
          path: dependencies/wp1
          persist-credentials: false
      - name: Checkout pinned WP2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pragma: allowlist secret
        with:
          repository: Grahammmm/DeFlock-Campaign-Tool
          ref: '${{ env.WP2_REVISION }}'
          path: dependencies/wp2
          persist-credentials: false
      - name: Checkout pinned PR19
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pragma: allowlist secret
        with:
          repository: Grahammmm/DeFlock-Campaign-Tool
          ref: '${{ env.PR19_REVISION }}'
          path: dependencies/pr19
          persist-credentials: false
      - name: Checkout pinned WP4
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pragma: allowlist secret
        with:
          repository: Grahammmm/DeFlock-Campaign-Tool
          ref: '${{ env.WP4_REVISION }}'
          path: dependencies/wp4
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pragma: allowlist secret
        with:
          python-version: '${{ matrix.python }}'
      - name: Install parsers and scanner in disposable CI only
        working-directory: engine
        run: python -m pip install -r requirements-records-test.txt
      - name: File launcher guards
        working-directory: engine
        run: python -B tools/run_wp5_ci.py --self-test
      - name: Exact 64 catalog and 4 composition tests; no skips
        working-directory: engine
        run: |
          python -B tools/run_wp5_ci.py \
            --wp1 "$GITHUB_WORKSPACE/dependencies/wp1" \
            --wp2 "$GITHUB_WORKSPACE/dependencies/wp2" \
            --wp4 "$GITHUB_WORKSPACE/dependencies/wp4" \
            --pr19 "$GITHUB_WORKSPACE/dependencies/pr19" \
            --output-parent "$RUNNER_TEMP"
      - name: Public-tree credential and private-path scan
        if: always()
        working-directory: engine
        run: python -B tools/check_public_tree.py
      - name: Credential scan without network verification
        if: always()
        working-directory: engine
        run: |
          detect-secrets scan --all-files --exclude-files '^.git/' --no-verify > "$RUNNER_TEMP/wp5-secret-scan.json"
          python tools/check_secret_report.py "$RUNNER_TEMP/wp5-secret-scan.json"
