# Review-branch-only acceptance; do not merge this workflow variant into main.
name: Records intake checks
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed candidate commit SHA
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  intake:
    if: github.ref == 'refs/heads/codex/flock-c20-ci-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
      - name: Bind reviewed candidate and Linux runtime
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          C20_FOLDER_SHA256: '00eb1077446e71da41de5e32dfa2d45bf5f21b7c8865ec3f4cbcd6c6e9cfc57f' # pragma: allowlist secret - public file SHA-256
          C20_MANIFEST_SHA256: '16fac4f376734ba3ee5a7a3db906a5f843ba1aa1490c4713f995593c56cba413' # pragma: allowlist secret - public file SHA-256
          C20_SCANNER_SHA256: 'd14dacd77ce628a89a5451e8413c507777bb2d2a3385fadbb11e6690a60fcb23' # pragma: allowlist secret - public file SHA-256
          C20_FOCUSED_TEST_SHA256: '27e1474f434108e0752058fc57f37187328e2e641f2ff22c800290a5cb81e6ff' # pragma: allowlist secret - public file SHA-256
          C20_LEGACY_TEST_SHA256: '3663b906ce162da191b9f27f1efe2a5b28e4b5e7ece72c3c72e4139591e29da2' # pragma: allowlist secret - public file SHA-256
          C20_ROUTE_TEST_SHA256: '26ced5584b029449c57ef4616f3dcaa4966aa118da52d27d77fdd5707f28070b' # pragma: allowlist secret - public file SHA-256
          C20_RESOURCE_TEST_SHA256: '1ef57c3adcb494dd6ec08471be0eb52e872187d720e8f63c953e3266375b1046' # pragma: allowlist secret - public file SHA-256
          C20_REQUIREMENTS_SHA256: '8699276a235c5cbe5a091aaf76f9673ff193c91af6b490bdcc9d265a220b8f54' # pragma: allowlist secret - public file SHA-256
        run: |
          python -B - <<'PYCODE'
          import hashlib, json, os, pathlib, platform, re, subprocess, sys
          expected = os.environ['EXPECTED_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', expected), 'invalid expected commit'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == expected == os.environ['GITHUB_SHA'], 'candidate commit mismatch'
          assert sys.platform == 'linux' and sys.version_info[:3] == (3, 11, 17)
          pin_names = {
              'campaign_tool/records/intake/folder.py': 'C20_FOLDER_SHA256',
              'docs/records-intake-import.json': 'C20_MANIFEST_SHA256',
              'tools/check_secret_report.py': 'C20_SCANNER_SHA256',
              'tests/records/test_c20_csv_strict_mapping.py': 'C20_FOCUSED_TEST_SHA256',
              'tests/records/test_intake.py': 'C20_LEGACY_TEST_SHA256',
              'tests/records/test_extraction_routes.py': 'C20_ROUTE_TEST_SHA256',
              'tests/records/test_extraction_inherited_budget.py': 'C20_RESOURCE_TEST_SHA256',
              'requirements-records-test.txt': 'C20_REQUIREMENTS_SHA256',
          }
          pins = {path: os.environ[name] for path, name in pin_names.items()}
          assert all(re.fullmatch(r'[0-9a-f]{64}', value) for value in pins.values()), 'invalid file hash anchor'
          actual = {path: hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() for path in pins}
          assert actual == pins, 'candidate or dependency hash mismatch'
          receipt = json.dumps(dict(head=head, python=sys.version, platform=platform.platform(), sha256=actual), sort_keys=True)
          print(receipt)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'c20-candidate.json').write_text(receipt + "\n")
          PYCODE
      - name: Install test parsers in disposable CI only
        run: python -m pip install -r requirements-records-test.txt
      - name: C20 plus legacy CSV contracts with real worker guards
        timeout-minutes: 15
        run: |
          set -o pipefail
          python -B - <<'PYCODE' 2>&1 | tee "$RUNNER_TEMP/c20-acceptance.log"
          import unittest
          names = [
              'tests.records.test_extraction_inherited_budget.InheritedExtractionBudgetTests.test_native_text_respects_parent_caps_and_records_effective_memory',
              'tests.records.test_intake.IntakeTests.test_csv_whitespace_redaction_duplicate_and_multiline_locators',
              'tests.records.test_intake.IntakeTests.test_csv_and_tsv_ragged_records_retain_values_without_header_inference',
              'tests.records.test_extraction_routes.ExtractionRoutesTests.test_csv_empty_redacted_and_na_preserved',
              'tests.records.test_c20_csv_strict_mapping',
          ]
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          assert suite.countTestCases() == 12, 'focused test inventory changed'
          result = unittest.TextTestRunner(verbosity=2, failfast=True).run(suite)
          if result.skipped or result.testsRun != 12 or not result.wasSuccessful():
              raise SystemExit(1)
          PYCODE
      - name: Credential scan without network verification
        if: always()
        run: |
          set -o pipefail
          detect-secrets scan --all-files --exclude-files '^.git/' --no-verify > "$RUNNER_TEMP/secret-scan.json"
          python tools/check_secret_report.py "$RUNNER_TEMP/secret-scan.json" | tee "$RUNNER_TEMP/c20-scan-summary.log"
      - name: Retain C20 acceptance and scanner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pragma: allowlist secret - verified public action commit
        with:
          name: c20-evidence-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/c20-candidate.json
            ${{ runner.temp }}/c20-acceptance.log
            ${{ runner.temp }}/secret-scan.json
            ${{ runner.temp }}/c20-scan-summary.log
          if-no-files-found: error
          retention-days: 30
