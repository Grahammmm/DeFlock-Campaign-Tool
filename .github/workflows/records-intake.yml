name: Records intake checks
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  intake:
    runs-on: ${{ (vars.CI_SELF_HOSTED_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.CI_RUNNER || 'ubuntu-24.04' }}
    # The full synthetic suite measured 631-1041 s on successful hosted runs
    # (2026-10-25) and was killed at the former 18-minute step cap on main and
    # PRs alike; keep the cap well above the measured maximum.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # PRs: one interpreter (the merge clock). Main push: full matrix.
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.11","3.12","3.13"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Install test parsers in disposable CI only
        run: python -m pip install -r requirements-records-test.txt
      - name: Synthetic offline extraction tests
        timeout-minutes: 30
        run: python -B -m unittest discover -v
      - name: Credential scan without network verification
        # The default Git-tracked scope excludes generated/untracked output
        # wherever it is written, while keeping every tracked path in scope.
        run: |
          detect-secrets scan --no-verify > "$RUNNER_TEMP/secret-scan.json"
          python tools/check_secret_report.py "$RUNNER_TEMP/secret-scan.json"
