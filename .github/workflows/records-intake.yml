name: Records intake checks
on:
  workflow_call:
# records.yml owns cancellation and the shared full discovery gate.
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
            setup.py
      - name: Install test parsers in disposable CI only
        run: python -m pip install -r requirements-records-test.txt
      # Identical dependency/test population now runs once in records.yml's
      # shards; the legacy intake (3.x) gates require both tests and this scan.
      - name: Credential scan without network verification
        run: |
          detect-secrets scan --all-files --exclude-files '^.git/' --no-verify > "$RUNNER_TEMP/secret-scan.json"
          python tools/check_secret_report.py "$RUNNER_TEMP/secret-scan.json"
