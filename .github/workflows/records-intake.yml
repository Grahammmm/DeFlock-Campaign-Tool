name: Records intake checks
on:
  schedule:
    - cron: '17 7 * * *'
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-24.04
    # The full synthetic suite measured 631-1041 s on successful hosted runs
    # (2026-10-25) and was killed at the former 18-minute step cap on main and
    # PRs alike; keep the cap well above the measured maximum.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # PRs: one interpreter (the merge clock). Main push: full matrix.
        python: ['3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '${{ matrix.python }}'
      - name: Install test parsers in disposable CI only
        run: python -m pip install -r requirements-records-test.txt
      # Source tests have one owner in tools/ci_affected.py. This workflow owns
      # only the detect-secrets scan, not another full discovery invocation.
      - name: Credential scan without network verification
        # The default Git-tracked scope excludes generated/untracked output
        # wherever it is written, while keeping every tracked path in scope.
        run: |
          detect-secrets scan --no-verify > "$RUNNER_TEMP/secret-scan.json"
          python tools/check_secret_report.py "$RUNNER_TEMP/secret-scan.json"
