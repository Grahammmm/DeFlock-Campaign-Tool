name: Records intake checks
on:
  schedule:
    - cron: '17 7 * * *'
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-24.04
    # The full synthetic suite measured 631-1041 s on successful hosted runs
    # (2026-10-25) and was killed at the former 18-minute step cap on main and
    # PRs alike; keep the cap well above the measured maximum.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # PRs: one interpreter (the merge clock). Main push: full matrix.
        python: ['3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Install test parsers in disposable CI only
        run: python -m pip install -r requirements-records-test.txt
      # Source tests have one owner in tools/ci_affected.py. This workflow owns
      # only the detect-secrets scan, not another full discovery invocation.
      - name: Credential scan without network verification
        # build/ is git-ignored and holds only output the test step above just
        # generated (synthetic projects with sha256 provenance fields), so it is
        # never tracked source; every tracked path is still scanned.
        run: |
          detect-secrets scan --all-files --exclude-files '^(\.git|build)/' --no-verify > "$RUNNER_TEMP/secret-scan.json"
          python tools/check_secret_report.py "$RUNNER_TEMP/secret-scan.json"
