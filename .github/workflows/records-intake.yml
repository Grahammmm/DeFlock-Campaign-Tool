name: Records intake checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Install test parsers in disposable CI only
        run: python -m pip install -r requirements-records-test.txt
      - name: Synthetic offline extraction tests
        timeout-minutes: 15
        run: python -B -m unittest discover -v
      - name: Credential scan without network verification
        run: |
          detect-secrets scan --all-files --exclude-files '^.git/' --no-verify > "$RUNNER_TEMP/secret-scan.json"
          python tools/check_secret_report.py "$RUNNER_TEMP/secret-scan.json"
