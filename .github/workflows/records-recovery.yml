name: WP9 recovery and pinned WP8 composition
on:
  pull_request:
  push:
    branches: [main, 'batch/**']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  recovery-composition-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(github.event_name == 'pull_request' && github.head_ref != 'main' && !startsWith(github.head_ref, 'batch/') && '["3.13"]' || '["3.11", "3.12", "3.13"]') }}
    steps:
      - name: Check out WP9 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check out immutable public WP8 dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Grahammmm/DeFlock-Campaign-Tool
          ref: 77e576e322bf37c4e9177d6def468950ed6b8211 # pragma: allowlist secret - verified public WP8 commit
          path: .ci-dependencies/wp8
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Select in-tree or pinned WP8
        shell: bash
        run: |
          # Explicit file-based detection: in-tree WP8 is used from this checkout.
          if [[ -f campaign_tool/records/review_bundle.py ]]; then
            printf '%s\n' 'WP8 in tree; using this checkout.'
            printf 'WP8_ROOT=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            printf 'WP8_ROOT=%s\n' "$GITHUB_WORKSPACE/.ci-dependencies/wp8" >> "$GITHUB_ENV"
          fi
      - name: Require exactly 61 synthetic tests with actual WP8 and no skips
        env:
          TMPDIR: '${{ runner.temp }}'
          REQUIRE_WP8_INTEGRATION: '1'
        run: python -B tests/records/run_recovery_composition.py --wp8-root "$WP8_ROOT"
  recovery-composition:
    needs: recovery-composition-tests
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - name: All selected interpreters must pass (PR compatibility alias)
        env:
          RESULT: ${{ needs.recovery-composition-tests.result }}
        run: test "$RESULT" = success
