name: WP9 recovery and pinned WP8 composition
on:
  pull_request:
  push:
    branches: [main, 'codex/records-*']
permissions:
  contents: read
jobs:
  recovery-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out WP9 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check out immutable public WP8 dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Grahammmm/DeFlock-Campaign-Tool
          ref: 77e576e322bf37c4e9177d6def468950ed6b8211 # pragma: allowlist secret - verified public WP8 commit
          path: .ci-dependencies/wp8
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Require exactly 61 synthetic tests with actual WP8 and no skips
        env:
          TMPDIR: '${{ runner.temp }}'
          REQUIRE_WP8_INTEGRATION: '1'
        run: python -B tests/records/run_recovery_composition.py --wp8-root .ci-dependencies/wp8
